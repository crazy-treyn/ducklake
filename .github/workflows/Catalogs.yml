name: DBMS Catalog Tests
on: [push, pull_request, repository_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  ducklake-config-tests:
    name: DuckDB Tests with DuckLake + (Postgres/SQLite)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ['linux_amd64']
        vcpkg_version: [ '2023.04.15' ]
        include:
          - arch: 'linux_amd64'
            vcpkg_triplet: 'x64-linux'

    env:
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_triplet }}
      GEN: Ninja
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      ENABLE_SQLITE_SCANNER: ON
      ENABLE_POSTGRES_SCANNER: ON
      BUILD_EXTENSION_TEST_DEPS: full

    steps:
    - name: Install required ubuntu packages
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install -y -qq build-essential cmake ninja-build ccache python3

    - name: Setup PostgreSQL for Linux/macOS/Windows
      uses: ikalnytskyi/action-setup-postgres@v7
      with:
        postgres-version: '15'
        username: 'postgres'
        password: 'postgres'
        database: 'postgres'
        port: '5432'
        ssl: true

    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        submodules: 'true'

    - name: Checkout DuckDB to version
      run: |
        cd duckdb
        git checkout $(cat ../.github/duckdb-version)

    - name: Setup Ccache
      uses: hendrikmuhs/ccache-action@main
      with:
        key: ${{ github.job }}
        save: ${{ github.ref == 'refs/heads/main' || github.repository != 'duckdb/ducklake' }}

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11.1
      with:
        vcpkgGitCommitId: 84bab45d415d22042bd0b9081aea57f362da3f35

    - name: Build extension
      env:
        GEN: ninja
      run: |
        make release

    - name: Test SQLite
      run: |
        build/release/test/unittest --test-config test/configs/sqlite.json --test-dir ./ "test/sql/*"

    - name: Test Postgres
      env:
        PGSERVICE: postgres
      run: |
        # Pre-install postgres_scanner so LOAD finds it without autoloading
        # (autoloading is disabled to prevent loading wrong ducklake version)
        REPO_DIR="build/release/repository/$(cat .github/duckdb-version)/${{ matrix.arch }}"
        EXT_DIR="$HOME/.duckdb/extensions/$(cat .github/duckdb-version)/${{ matrix.arch }}"
        mkdir -p "$EXT_DIR"
        cp "$REPO_DIR/postgres_scanner.duckdb_extension" "$EXT_DIR/"
        createdb ducklakedb
        build/release/test/unittest --test-config test/configs/postgres.json --test-dir ./ "test/sql/*"

  ducklake-mssql-tests:
    name: DuckDB Tests with DuckLake + MSSQL
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ['linux_amd64']
        vcpkg_version: [ '2023.04.15' ]
        include:
          - arch: 'linux_amd64'
            vcpkg_triplet: 'x64-linux'

    env:
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_triplet }}
      GEN: Ninja
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      ENABLE_MSSQL_SCANNER: ON
      ENABLE_SQLITE_SCANNER: OFF
      ENABLE_POSTGRES_SCANNER: OFF
      BUILD_EXTENSION_TEST_DEPS: full

    steps:
    - name: Install required ubuntu packages
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install -y -qq build-essential cmake ninja-build ccache python3

    - name: Start SQL Server
      run: |
        docker run -d --name sqlserver \
          -e ACCEPT_EULA=Y \
          -e MSSQL_SA_PASSWORD='DuckLake_Test123!' \
          -p 1433:1433 \
          mcr.microsoft.com/mssql/server:2022-latest
        for i in $(seq 1 60); do
          if docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DuckLake_Test123!' -Q "SELECT 1" >/dev/null 2>&1; then
            echo "SQL Server is up"
            break
          fi
          if docker exec sqlserver /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'DuckLake_Test123!' -Q "SELECT 1" >/dev/null 2>&1; then
            echo "SQL Server is up (legacy tools path)"
            break
          fi
          echo "waiting for SQL Server... ($i)"
          sleep 2
        done
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd
        if ! docker exec sqlserver "$SQLCMD" -S localhost -U sa -P 'DuckLake_Test123!' -Q "SELECT 1" >/dev/null 2>&1; then
          SQLCMD=/opt/mssql-tools/bin/sqlcmd
        fi
        docker exec sqlserver "$SQLCMD" -S localhost -U sa -P 'DuckLake_Test123!' -Q "IF EXISTS (SELECT name FROM sys.databases WHERE name = N'ducklake_catalog') BEGIN ALTER DATABASE [ducklake_catalog] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [ducklake_catalog]; END"
        docker exec sqlserver "$SQLCMD" -S localhost -U sa -P 'DuckLake_Test123!' -Q "CREATE DATABASE [ducklake_catalog]"

    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        submodules: 'true'

    - name: Checkout DuckDB to version
      run: |
        cd duckdb
        git checkout $(cat ../.github/duckdb-version)

    - name: Setup Ccache
      uses: hendrikmuhs/ccache-action@main
      with:
        key: ${{ github.job }}
        save: ${{ github.ref == 'refs/heads/main' || github.repository != 'duckdb/ducklake' }}

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11.1
      with:
        vcpkgGitCommitId: 84bab45d415d22042bd0b9081aea57f362da3f35

    - name: Build extension
      env:
        GEN: ninja
      run: |
        make release

    - name: Test MSSQL catalog
      run: |
        REPO_DIR="build/release/repository/$(cat .github/duckdb-version)/${{ matrix.arch }}"
        EXT_DIR="$HOME/.duckdb/extensions/$(cat .github/duckdb-version)/${{ matrix.arch }}"
        mkdir -p "$EXT_DIR"
        cp "$REPO_DIR/mssql.duckdb_extension" "$EXT_DIR/"
        build/release/test/unittest --test-config test/configs/mssql.json --test-dir ./ "test/sql/*"
